services:
  - type: web
    name: quan-ly-cong-viec-gdmn
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: Phần mềm hỗ trợ quản lý công việc - Ngành GDMN
